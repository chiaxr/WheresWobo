# Shared material palette for every map.
#
# rgb is both the colour the renderer draws and the colour the simulated
# colourized LiDAR returns for that surface. pattern is a colour-independent
# mark drawn on top of solid blocks (none, stripes, dots, checker, chevron,
# grid) so surfaces never rely on colour alone. Floor materials are visual
# only: the planar LiDAR never sees the floor.

[material.wall]
name = Plaster
rgb = 168, 172, 186
solid = true
height = 0.7

[material.wall_dark]
name = Slate
rgb = 128, 132, 148
solid = true
height = 0.7
pattern = grid

[material.wall_light]
name = Chalk
rgb = 196, 196, 204
solid = true
height = 0.7
pattern = dots

[material.wall_red]
name = Tomato
rgb = 228, 92, 84
solid = true
height = 0.7
pattern = stripes

[material.wall_blue]
name = Cobalt
rgb = 78, 138, 222
solid = true
height = 0.7
pattern = dots

[material.wall_yellow]
name = Mustard
rgb = 246, 198, 66
solid = true
height = 0.7
pattern = chevron

[material.wall_green]
