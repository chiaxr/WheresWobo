weight = 3
max_stack = 1
requires = kidnap
effect = passive aftershock

[card.vertigo]
name = Vertigo
category = passive
description = Gyro Jam's gyro drift is three times as strong.
weight = 3
max_stack = 1
effect = passive vertigo

[card.brinkmanship]
name = Brinkmanship
category = passive
description = Actions cost 30% less while Wobo is closing in on its true position.
weight = 3
max_stack = 1
effect = passive brinkmanship

[card.chain_reaction]
name = Chain Reaction
category = passive
description = Using an action takes 2 s off every other action's cooldown.
weight = 3
max_stack = 2
