# --- Special / one-shot --------------------------------------------------------

[card.power_surge]
name = Power Surge
category = special
description = Instantly refill your energy to full.
weight = 2
max_stack = 99
effect = oneshot power_surge

[card.spare_kidnap]
name = Spare Crane
category = special
description = Your next Kidnap is free and ignores its cooldown.
weight = 2
max_stack = 99
requires = kidnap
effect = oneshot spare_kidnap

[card.cold_snap]
name = Cold Snap
category = special
description = Every cooldown resets right now.
weight = 2
max_stack = 99
effect = oneshot cold_snap
