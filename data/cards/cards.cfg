# Draft cards. One section per card: [card.<id>].
#
#   name, description  -- shown on the card
#   category           -- ability | upgrade | energy | passive | special
#   weight             -- relative draft weight
#   max_stack          -- how many times a run may take it
#   requires           -- an action that must be owned (optional)
#   needs              -- a map trait it is only any use with: colour, block, repaint (optional)
#   min_hour           -- earliest hour it can be offered (optional)
#   effect             -- one or more of:
#       grant <action>                    unlock an action
#       stat <key> <op><value>            op is + * or =, e.g. stat action.range.duration *1.5
#       passive <id>                      add a stack of a passive
#       oneshot <id>                      immediate effect (power_surge, spare_kidnap, cold_snap)

# --- New abilities ---------------------------------------------------------

[card.kidnap]
name = Kidnap
category = ability
description = New action: a crane carries Wobo anywhere you like, and its software is never told.
weight = 3
max_stack = 1
effect = grant kidnap

[card.colour]
name = Colour Blind
category = ability
description = New action: red-green shades swap the colours Wobo's scanner sees round, and are so dark it can't see anything straight ahead.
weight = 4
max_stack = 1
effect = grant colour

[card.gummy]
name = Gummy Wheels
category = ability
description = New action: bubblegum on Wobo's wheels slows it down and makes them slip, so it overestimates how far it went.
weight = 4
max_stack = 1
effect = grant gummy

[card.block]
name = Road Block
category = ability
description = New action: drop a barrier that isn't on Wobo's map. Its scans stop matching and its route is cut.
weight = 4
max_stack = 1
effect = grant block

[card.range_long]
name = Lingering Smoke
category = upgrade
description = Smoke Bomb lasts 50% longer.
weight = 3
max_stack = 3
effect = stat action.range.duration *1.5

[card.range_deep]
name = Thick Fog
category = upgrade
description = Smoke Bomb cuts the scanner's reach even further.
weight = 3
max_stack = 2
effect = stat action.range.scale *0.7

[card.range_cheap]
name = Bargain Bombs
category = upgrade
description = Smoke Bomb costs 30% less.
weight = 3
max_stack = 2
effect = stat action.range.cost *0.7

[card.drift_strong]
name = Head Spin
category = upgrade
description = Gyro Jam's heading errors are 50% stronger.
weight = 3
max_stack = 3
effect = stat action.drift.turn_scale_bias *1.5
effect = stat action.drift.turn_bias *1.5

[card.drift_long]
name = Long Spin
category = upgrade
description = Gyro Jam lasts 40% longer and recharges 2 s sooner.
weight = 3
max_stack = 3
effect = stat action.drift.duration *1.4
effect = stat action.drift.cooldown +-2

[card.gummy_sticky]
name = Extra Chewy
category = upgrade
description = Gummy Wheels lasts 50% longer.
weight = 3
max_stack = 2
requires = gummy
effect = stat action.gummy.duration *1.5

[card.block_long]
name = Long Roadworks
category = upgrade
description = Road Block stays up 50% longer.
weight = 3
max_stack = 2
requires = block
effect = stat action.block.duration *1.5

[card.kidnap_cheap]
name = Cheap Crane Hire
category = upgrade
description = Kidnap costs 15 less energy.
weight = 3
max_stack = 2
requires = kidnap
effect = stat action.kidnap.cost +-15

[card.kidnap_cool]
name = Hot Swap
category = upgrade
description = Kidnap recharges 30% faster.
weight = 3
max_stack = 2
requires = kidnap
effect = stat action.kidnap.cooldown *0.7

[card.colour_long]
name = Mirrored Shades
category = upgrade
description = Colour Blind lasts 50% longer.
weight = 3
max_stack = 2
requires = colour
effect = stat action.colour.duration *1.5

[card.repaint]
name = Repainting Works
category = upgrade
description = Colour Blind sometimes calls the painters: for its duration, the walls round Wobo read in the colours of a place elsewhere that is the same shape.
weight = 3
max_stack = 2
requires = colour
needs = repaint
effect = stat action.colour.repaint_chance +0.25

[card.battery]
name = Spare Battery
category = energy
description = +25 maximum energy.
weight = 4
max_stack = 4
effect = stat energy.capacity +25

[card.solar]
name = Solar Panel
category = energy
description = Energy regenerates 0.8 per second faster.
weight = 4
max_stack = 4
effect = stat energy.regen +0.8

[card.capacitor]
name = Supercapacitor
category = energy
description = +15 maximum energy and +0.4 regeneration.
weight = 3
max_stack = 3
effect = stat energy.capacity +15
effect = stat energy.regen +0.4

