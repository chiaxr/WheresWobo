# Where's Wobo? -- game tuning.
#
# Everything here is read at run start; nothing is baked into the code except
# defaults. Times are simulation seconds (they scale with game speed and stop
# when paused). Distances are metres; the maps use 0.5 m cells.

[sim]
step_hz = 30

[run]
hour_length = 60         # game seconds per hour (one real minute at 1x); a card draft follows each
hours = 24               # the day: Wobo still lost at the end of the last hour is the player's win (0: endless)
# Wobo never starts within start_unique_radius (m) of a place nothing on the
# map looks like by shape (nothing start_twin_distance or more away), such as
# a hallway's dead end: from there it knows where it is almost at once. 0: anywhere.
start_unique_radius = 1.0
start_twin_distance = 2.0
prior = uniform          # uniform | gaussian (gaussian centres on the true start; for testing)
prior_sigma = 1.0

[calibration]
# Wobo starts each run with its sensors noisier than rated, and settles a
# little more every hour: extra noise in hour h = value * hourly_factor^(h-1).
# Its localizer always assumes the rated noise, so early hours are gentler for
# the player and the pressure builds as the run goes on.
range_noise = 0.2        # extra LiDAR range noise (m) in hour 1
colour_noise = 48        # extra colour noise per channel in hour 1
odometry_noise = 3       # extra odometry noise multiple in hour 1 (3 -> 4x)
hourly_factor = 0.7      # how much of the extra noise remains each new hour

[learning]
# From `view_hour` on, Wobo has learned to recognise places: when its belief
# goes wrong it re-seeds from where its scan fits the map's precomputed views
# (localizer.view_injection). It samples them at `view_temperature` in that
# hour, and each new hour the gap to `view_final` shrinks to
# view_hourly_factor of itself, so it gets sharper the longer the day goes on.
# view_hour = 0 leaves it to the localizer's own setting.
view_hour = 12
view_temperature = 0.08
view_final = 0.5
view_hourly_factor = 0.8

[compute]
# Wobo's onboard computer warms up over a run. Its localizer's budget is
# `share` of the configured amount in hour 1 and grows towards `final_share`;
# it runs `update_hz` times a second in hour 1 (0: on every scan,
# sensor.scan_hz), growing towards every scan. Each new hour the gap to the
# final budget shrinks to hourly_factor of itself. The particle filter scales
# the poses it tries per injected particle with the budget, and spends it up
# to 1 on particles and beyond 1 on reading more of each scan: at 2, every
# other beam instead of every 4th.
share = 0.2
final_share = 3
update_hz = 0.5
hourly_factor = 0.8

[robot]
radius = 0.2
max_speed = 0.4
max_turn_rate = 1.6
accel = 1.5
turn_accel = 6.0

[sensor]
beams = 32
max_range = 2.5
scan_hz = 4
range_noise = 0.04
colour_noise = 14         # per channel, 0..255
colour_levels = 8
dropout = 0.02

[odometry]
forward_var_per_m = 0.0025
lateral_var_per_m = 0.0006
turn_var_per_rad = 0.0016
turn_var_per_m = 0.0008
drift_walk = 0.002
drift_limit = 0.03

[localizer]
type = particle_filter
particles = 2500
beam_stride = 4
sigma_range = 0.2
sigma_colour = 0.2
colour_floor = 0.15
p_random = 0.05
p_unexpected_miss = 0.2
temperature = 0.08
forward_var_per_m = 0.008
lateral_var_per_m = 0.002
turn_var_per_rad = 0.006
turn_var_per_m = 0.004
jitter_m = 0.015
jitter_rad = 0.01
alpha_slow = 0.02
alpha_fast = 0.3
max_injection = 0.08
inject_candidates = 8    # random poses tried per injected particle; the best fit to the scan is kept
view_injection = 0       # 1: try them round poses drawn from how well each cell's view fits the scan
resample_ess = 0.5
cluster_radius = 0.6
cluster_heading_deg = 35

[planner]
type = info_gain
hypotheses = 24
beams = 16
sigma_range = 0.2
sigma_colour = 0.18
discrimination = 0.5
distance_cost = 0.06
turn_cost = 0.02
blocked_cost = 2.5
novelty_weight = 0.25
novelty_radius = 1.2
safety_margin = 0.15
randomness = 0.03
scan_pause = 0.5
merge_radius = 0.3       # sampled particles this alike count as one hypothesis
merge_heading_deg = 20
# When no short move would teach Wobo anything (or the belief has not narrowed
# for `patience` seconds) it travels to the spot that best tells its estimate
# apart from its look-alikes, so a confidently wrong belief meets evidence.
stuck_gain = 0.05        # expected gain (nats) below which it travels instead
patience = 15
landmark_weight = 1.5
goal_path_cost = 0.06    # per metre of path
goal_novelty_radius = 1.5
goal_reach = 0.6
goal_timeout = 30

[agent]
boot = 3                 # seconds Wobo spends waking up before it senses or moves
front_stop = 0.12
confusion_threshold = 0.45
confusion_cooldown = 10
cautious_speed = 0.7

[referee]
position_tolerance = 0.3
heading_tolerance_deg = 12
stability = 4.0          # seconds the estimate must stay correct
close_call = 0.75        # lock progress that counts as a near miss if it then breaks

[energy]
capacity = 100
start = 50
regen = 3.0              # per second

# --- Player actions -------------------------------------------------------
# cost / duration / cooldown are in energy and seconds. cooldown starts when
# the effect ends (when the action is used, for Kidnap), so no effect can be
# kept up without a break. owned = 1 marks the permanent basic kit (Smoke Bomb
# and Gyro Jam); the others are unlocked by cards.

[action.range]            # Smoke Bomb
owned = 1
cost = 18
duration = 6
cooldown = 8
scale = 0.35             # LiDAR max range multiplier

[action.drift]            # Gyro Jam: heading only
owned = 1
cost = 25
duration = 7
cooldown = 10
noise_scale = 4          # heading noise multiplier
turn_scale_bias = 0.3    # reported rotation error (fraction)
turn_bias = 0.35         # heading error per metre (rad)
heading_bias = 0.10      # gyro error while moving or turning (rad/s), so it can break a settled lock

[action.kidnap]           # Kidnap: unlocked by its card, never part of the starting kit
cost = 50                # at 70 it bought the fewest seconds per energy of any action, and drafting it lost runs
cooldown = 25
min_distance = 2.0       # how far the destination must be from Wobo

[action.colour]           # Colour Blind: colours swapped round, and blind dead ahead
cost = 18
duration = 7
cooldown = 9
desaturate = 0           # a clean swap misleads; washed-out colour only hides
hue_shift = 1
noise = 0
blind_cone = 90          # half-angle (degrees) of a blind spot dead ahead
blind_chance = 1         # chance each beam in it returns nothing
repaint_chance = 0       # chance a use also sets Repainting Works off (its card raises it)
min_colour_share = 0.1   # its card is only offered on maps where this share of visible walls is colourful

[action.gummy]            # Gummy Wheels: distance only (a real slow-down helped Wobo: more scans per metre)
cost = 22
duration = 7
cooldown = 10
noise_scale = 4          # wheel (distance) noise multiplier
scale_bias = 0.5         # the wheels slip: reported distance is this much too long

[action.repaint]          # Repainting Works, Colour Blind's upgrade: Wobo's surroundings read in a look-alike's colours
min_distance = 3          # the look-alike is at least this far away (m)
min_colour_beams = 4      # of 32 directions, at least this many must differ in colour
min_twin_share = 0.1      # its card is only offered on maps where this share of places has such a look-alike

[action.block]            # Road Block: a 1.5 m barrier that is not on Wobo's map
cost = 30
duration = 12
cooldown = 20

[action.overload]         # Overload: Wobo's computer falls back to a trickle of compute
cost = 30
duration = 4
cooldown = 14
share = 0.1              # its localizer's budget is capped at this share (0.1: 250 of 2500 particles)
update_hz = 0.25         # and it reads a scan at most this often, so its estimate goes stale as it drives

[action.magnet]           # Magnet: drags Wobo straight towards a spot you pick; anything in the way stops it
cost = 50
duration = 6
cooldown = 25
range = 5                # how far from Wobo it can stand (m)
speed = 0.8              # how fast it drags Wobo (m/s); Wobo itself drives at up to robot.max_speed

# --- Passive effects ------------------------------------------------------
[passive]
overclock_bonus = 0.25     # extra regen fraction while any effect is active (0.5 made it the strongest card by far)
static_cling_noise = 0.15  # range noise added by Smoke Bomb
aftershock_duration = 4    # free Gyro Jam after a kidnap
vertigo_bias = 0.2         # heading bias added by Gyro Jam
brinkmanship_discount = 0.3
brinkmanship_threshold = 0.4
chain_reaction_seconds = 2
